# This workflow is managed by gh actions-lock.

name: Container

on:
  workflow_call:
    inputs:
      tag:
        type: string
        description: The tag name (e.g. v1.2.3, docker-foo)
        required: true
      build-args:
        type: string
        description: Build arguments for the Dockerfile
        required: false
      dockerfile:
        type: string
        description: Path to the Dockerfile (default is Dockerfile)
        required: false
        default: Dockerfile
      context:
        type: string
        description: Context directory for the build (default is current directory)
        required: false
        default: .
      platforms:
        type: string
        description: Platforms to build for (default is linux/amd64,linux/arm64,linux/riscv64)
        required: false
      registry-url:
        type: string
        description: Container registry to push to (default is ghcr.io)
        required: false
      registry-username:
        type: string
        description: Username for the container registry (default is the triggering actor)
        required: false
      publish:
        type: boolean
        description: Whether to build and push the image
        required: false
        default: false
    secrets:
      registry-password:
        description: Password for the container registry (defaults to GITHUB_TOKEN)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Container
        uses: anselmes/clact/build/container@9e2e244aeb3c9c386baeb6b224f2ec5d028a47fb # v0.1.4
        with:
          build-args: ${{ inputs['build-args'] }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64,linux/riscv64' }}
          publish: ${{ inputs.publish }}
          registry_password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}
          registry_url: ${{ inputs['registry-url'] || 'ghcr.io' }}
          registry_username: ${{ inputs['registry-username'] || github.actor }}
          tag: ${{ inputs.tag }}
