  #       timeout-minutes: 5
  #       env:
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # needs: scanning
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Labeler
        uses: actions/labeler@v7.0.0
      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          # deny-packages: empty
          # retry-on-snapshot-warnings-timeout: 120
          # retry-on-snapshot-warnings: true
          allow-ghsas: none
          allow-licenses: Apache-2.0,BSD-2-Clause,BSD-3-Clause,CC0-1.0,GPL-2.0,GPL-3.0,ISC,MIT,LGPL-3.0
          fail-on-severity: low

  assign:
    runs-on: ubuntu-latest
    needs: review
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auto-assign
        uses: kentaro-m/auto-assign-action@v2.0.2
