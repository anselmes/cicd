# This workflow is managed by gh actions-lock.

name: Continuous Integration

on:
  - push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api0.prismacloud.io:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pypi.org:443
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter@v8.7.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS_ZIZMOR_CONFIG_FILE: .github/zizmor.yaml
          BASH_FILE_NAME: .trunk/configs/.shellcheckrc
          DOCKERFILE_HADOLINT_FILE_NAME: .trunk/configs/.hadolint.yaml
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_SPELL_CODESPELL: false

  bot:
    uses: ./.github/workflows/bot.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      repository-projects: write

  trivy:
    uses: ./.github/workflows/trivy.yml
    permissions:
      contents: write
      id-token: write
      security-events: write

  scorecard:
    uses: ./.github/workflows/scorecard.yml
    permissions:
      contents: read
      id-token: write
      security-events: write
