name: Package

on:
  workflow_call:
    inputs:
      target:
        type: string
        description: Package ecosystem to build (python)
        required: true
      name:
        type: string
        description: Package name
        required: true
      context:
        type: string
        description: Directory containing the project (default is current directory)
        required: false
        default: .
      wheel-dir:
        type: string
        description: Directory to write the wheel into, relative to context (python target only)
        required: false
      runner:
        type: string
        description: Runner to build on
        required: false
        default: ubuntu-latest
      artifact-name:
        type: string
        description: Name for the uploaded GitHub Actions artifact
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate target
        if: inputs.target != 'python'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "::error::Unsupported target '${TARGET}' (expected python)" >&2
          exit 1
      - name: Build Python package
        uses: anselmes/clact/package/python@654176f5d82a4047c504c6c9f9b083feec49fe5e # v0.1.2
        id: build-python
        if: inputs.target == 'python'
        with:
          context: ${{ inputs.context }}
          name: ${{ inputs.name }}
          wheel-dir: ${{ inputs.wheel-dir }}
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.context }}/${{ steps.build-python.outputs.wheel-dir }}/*.whl
