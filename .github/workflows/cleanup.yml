# This workflow is managed by gh actions-lock.

name: Cleanup OnDemand

permissions:
  contents: read

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: 30 1 * * 6
  workflow_call:
    inputs:
      branch:
        type: string
        description: Branch to cleanup (e.g. refs/pull/1/merge)
        default: ${{ github.ref }}
  workflow_dispatch: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Cleanup stale issues and PRs
        uses: actions/stale@v11.0.0
        with:
          any-of-labels: needs-more-info,needs-demo
          days-before-close: 5
          days-before-pr-close: -1
          days-before-stale: 30
          exempt-all-pr-assignees: true
          exempt-all-pr-milestones: true
          exempt-issue-milestones: future,alpha,beta
          stale-issue-label: no-issue-activity
          stale-issue-message: Message to comment on stale issues. If none provided, will not mark issues stale
          stale-pr-label: no-pr-activity
          stale-pr-message: Message to comment on stale PRs. If none provided, will not mark PRs stale

  cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cleanup cache
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        shell: bash
        env:
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./scripts/delete-gh-actions-cache.sh
      - name: Cleanup cache
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BRANCH: ${{ inputs.branch || github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./scripts/delete-gh-actions-cache.sh
