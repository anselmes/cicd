# This workflow is managed by gh actions-lock.

name: Chart

on:
  workflow_call:
    inputs:
      context:
        type: string
        description: Context directory for the build (default is current directory)
        required: false
        default: .
      registry-url:
        type: string
        description: Container registry to push to (default is ghcr.io)
        required: false
      registry-username:
        type: string
        description: Username for the container registry (default is the triggering actor)
        required: false
      publish:
        type: boolean
        description: Whether to package and push the chart
        required: false
        default: false
    secrets:
      registry-password:
        description: Password for the container registry (defaults to GITHUB_TOKEN)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Helm Chart
        uses: anselmes/clact/build/chart@c3f48a32de46b3c6153f7fb747b30415b2dd1786 # v0.1.5
        with:
          context: ${{ inputs.context }}
          publish: ${{ inputs.publish }}
          registry_password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}
          registry_url: ${{ inputs['registry-url'] || 'ghcr.io' }}
          registry_username: ${{ inputs['registry-username'] || github.actor }}
